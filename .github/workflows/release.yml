name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: notion-pin/electron-app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: notion-pin/electron-app/package-lock.json

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build application bundles
        run: npm run build

      - name: Package Intel DMG
        run: npx electron-builder --mac --x64 --publish never

      - name: Package Apple Silicon DMG
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify bundle signatures and disk images
        run: |
          for app_bundle in dist/mac/Nopin.app dist/mac-arm64/Nopin.app; do
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
          done
          for disk_image in dist/*.dmg; do
            hdiutil verify "$disk_image"
          done

      - name: Verify package metadata
        run: |
          for app_bundle in dist/mac/Nopin.app dist/mac-arm64/Nopin.app; do
            plist="$app_bundle/Contents/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.crazzzzhao.nopin"
            for privacy_key in \
              NSAudioCaptureUsageDescription \
              NSBluetoothAlwaysUsageDescription \
              NSBluetoothPeripheralUsageDescription \
              NSCameraUsageDescription \
              NSMicrophoneUsageDescription; do
              ! /usr/libexec/PlistBuddy -c "Print :$privacy_key" "$plist" >/dev/null 2>&1
            done
          done

      - name: Test packaged app on native Intel macOS
        timeout-minutes: 5
        run: NOPIN_TEST_BINARY="$PWD/dist/mac/Nopin.app/Contents/MacOS/Nopin" node scripts/check-window-motion.mjs

      - name: Generate checksums
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.dmg
          dist/SHA256SUMS.txt
          --verify-tag
          --title "Nopin $GITHUB_REF_NAME (Unsigned / 未签名)"
          --notes-file ../../docs/releases/unsigned-macos.md
          --generate-notes

      - name: Upload isolated UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-ui-checks
          path: notion-pin/electron-app/dist/window-check/
          if-no-files-found: ignore
          retention-days: 3
